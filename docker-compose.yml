version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
    restart: always

  backup:
    build: ./backup
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    restart: always
