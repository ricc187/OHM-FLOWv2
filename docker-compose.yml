version: '3.8'

services:
  web:
    build: .
    volumes:
      - ./data:/app/data
      - ./logs:/app/backend/logs
    env_file:
      - .env
    restart: always

  backup:
    build: ./backup
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
      # Swiss Backup credentials (rclone). Not baked into the image or
      # committed — place the real file at repo root as ./rclone.conf on
      # the VPS (gitignored, same pattern as Caddyfile). See DEPLOY.md.
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
    restart: always

  # Reverse proxy / public entrypoint. Terminates HTTPS with an
  # auto-provisioned Let's Encrypt cert (see Caddyfile) and forwards
  # everything to `web` over the internal compose network. `web` itself
  # has no `ports:` mapping — only caddy is reachable from outside the host.
  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: always

volumes:
  caddy_data:
  caddy_config:
