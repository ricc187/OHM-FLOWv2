version: '3.8'

services:
  web:
    build: .
    volumes:
      - ./data:/app/data
      - ./logs:/app/backend/logs
    env_file:
      - .env
    restart: always

  backup:
    build: ./backup
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    restart: always

  # Cloudflare quick tunnel — publishes `web` to a random *.trycloudflare.com
  # URL with no inbound port opened on the host at all (web has no `ports:`
  # mapping; only cloudflared reaches it, over the compose network). The URL
  # changes on every restart of this container (quick tunnels aren't
  # reservable) — read it from `docker compose logs cloudflared`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://web:5000
    depends_on:
      - web
    restart: always
