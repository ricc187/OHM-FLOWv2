version: '3.8'

services:
  web:
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: always

  backup:
    build: ./backup
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    restart: always

  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    depends_on:
      - web
